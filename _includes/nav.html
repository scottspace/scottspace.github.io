<!-- Current site header/nav (shared frame for legacy Jekyll pages). -->
<style>
  .sitehdr{
    position: sticky; top: 0; z-index: 1200;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 13px 24px;
    background: rgba(10,10,10,0.94);
    -webkit-backdrop-filter: saturate(140%) blur(8px);
    backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-family: 'Open Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  .sitehdr .sitehdr-brand{
    font-family: 'Lora', Georgia, serif; font-weight: 700;
    font-size: 1.12rem; color: #f0efe9; text-decoration: none;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .sitehdr .sitehdr-brand:hover{ color:#fff; text-decoration:none; }
  .sitehdr-links{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .sitehdr-links a{
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em;
    color: rgba(240,239,233,0.62); text-decoration: none; white-space: nowrap;
    text-transform: none;
  }
  .sitehdr-links a:hover{ color:#fff; text-decoration:none; }
  .sitehdr-links a.sitehdr-sub{ color:#c9a84c; }
  .sitehdr-links a.sitehdr-sub:hover{ color:#f4e6b8; }
  /* Pull the legacy page banner up under the new sticky bar. */
  .intro-header{ margin-top: 24px !important; }
  @media (max-width: 600px){
    .sitehdr{ padding: 11px 16px; }
    .sitehdr .sitehdr-brand{ font-size: 1rem; }
    .sitehdr-links{ gap: 14px; }
    .sitehdr-links a{ font-size: 0.76rem; }
  }
</style>
<header class="sitehdr" aria-label="Primary navigation">
  <a class="sitehdr-brand" href="{{ site.url }}">Scott Penberthy</a>
  <nav class="sitehdr-links">
    <a href="{{ site.url }}/era">The Era</a>
    <a href="{{ site.url }}/insights/">The Ledger</a>
    <a href="{{ site.url }}/speaking">Speaking</a>
    <a href="{{ site.url }}/aboutme">About</a>
    <a class="sitehdr-sub" href="https://aimoneymoves.substack.com/subscribe" target="_blank" rel="noopener">Subscribe</a>
  </nav>
</header>
